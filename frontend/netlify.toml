[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest-docente.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Si VITE_API_URL no está en el build, /api se proxy al backend (actualiza el dominio si cambia).
[[redirects]]
  from = "/api/*"
  to = "https://simevaluacion-production.up.railway.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
