<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#312e81" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("simeval_theme");
          if (theme !== "light" && theme !== "dark") theme = "dark";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#f1f5f9" : "#312e81");
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="SimEvaluación — seguimiento académico y comunicación escolar" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SimEval" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons.svg" />
    <script>
      if (location.pathname === "/ingresar-docente") {
        var m = document.querySelector('link[rel="manifest"]');
        if (m) m.href = "/manifest-docente.webmanifest";
        var t = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (t) t.content = "SimEval Doc";
      }
    </script>
    <title>SimEvaluación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root" style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#94a3b8">Cargando SimEvaluación…</div>
    <script>
      (function () {
        var FLAG = "simeval_sw_recover";
        function recover() {
          try {
            if (sessionStorage.getItem(FLAG)) return;
            sessionStorage.setItem(FLAG, "1");
          } catch (e) {}
          var done = function () {
            location.reload();
          };
          if (!("serviceWorker" in navigator)) {
            done();
            return;
          }
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }).then(function () {
            if (!window.caches) return;
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            });
          }).then(done).catch(done);
        }
        window.setTimeout(function () {
          var root = document.getElementById("root");
          if (root && root.childElementCount === 0) recover();
        }, 4000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
